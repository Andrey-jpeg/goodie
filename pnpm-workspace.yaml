packages:
  - "packages/*"
  - "examples/*"

# Keep pnpm 12 from adding an environment document that GitHub cannot parse.
# Corepack and pnpm/setup still install the packageManager version from package.json.
pmOnFail: ignore

allowBuilds:
  "better-sqlite3@13.0.3": true
  cpu-features: false
  "esbuild@0.25.12 || 0.28.1 || 0.28.2": true
  protobufjs: false
  "sharp@0.35.2": true
  ssh2: false
  "workerd@1.20260903.1": true

catalog:
  "@hono/node-server": "^2.1.1"
  "@testcontainers/postgresql": "^12.1.0"
  "@types/node": "^24.13.3"
  "@types/pg": "^8.23.1"
  "hono": "^4.13.5"
  "kysely": "^0.29.5"
  "pg": "^8.23.0"
  "ts-morph": "^28.0.0"
  "typescript": "^5.9.3"
  "valibot": "^1.4.2"
  "vite": "^6.4.3"
  "vitest": "^3.2.7"
